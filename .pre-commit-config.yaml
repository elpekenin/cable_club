exclude: vendor

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.6
    hooks:
      # Run the linter.
      - id: ruff
        # allow commiting with TODO and FIXME comments
        args: [--fix, --extend-ignore, TD, --extend-ignore, FIX]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
    - id: mypy
      args: [--strict]
      additional_dependencies: [distlib]
  - repo: local
    hooks:
      - id: unittest
        name: execute tests
        entry: python runner
        language: python
        types: [python]
        additional_dependencies: [distlib, typing_extensions]
